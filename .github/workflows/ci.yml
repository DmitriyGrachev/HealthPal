name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Unit and architecture tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Run architecture tests
        run: mvn -B -Parchitecture test

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run integration tests
        run: mvn -B verify -Pintegration

  dependency-hygiene:
    name: Dependency hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Analyze dependencies
        run: mvn -B dependency:analyze

      - name: Check for privacy-sensitive logging patterns
        shell: bash
        run: |
          if grep -RInE 'System\.out|System\.err|log\.(info|warn|error).*\b(text|prompt|content|token|secret)=' src/main/java; then
            echo "Potential privacy-sensitive logging pattern detected"
            exit 1
          fi
