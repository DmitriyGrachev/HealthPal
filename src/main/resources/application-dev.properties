# Local development profile. Activate explicitly with:
# SPRING_PROFILES_ACTIVE=dev

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitnessapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate
spring.jpa.show-sql=true

# FatSecret
fatsecret.client-id=${FATSECRET_CLIENT_ID}
fatsecret.client-secret=${FATSECRET_CLIENT_SECRET}
fatsecret.consumer-key=${FATSECRET_CONSUMER_KEY}
fatsecret.consumer-secret=${FATSECRET_CONSUMER_SECRET}
fatsecret.redirect-uri=${FATSECRET_REDIRECT_URI:http://localhost:8080/callback}
fatsecret.callback-url=${FATSECRET_CALLBACK_URL:http://localhost:8080/api/v1/nutrition/callback}

# App Security
fitness.app.secret=${FITNESS_APP_SECRET}

# Telegram Bot
telegram.bot.username=${TELEGRAM_BOT_USERNAME:healthpaltest_bot}

# OpenAI (OpenRouter)
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=8192
app.ai.openrouter.fallback-models=inclusionai/ling-2.6-flash:free,z-ai/glm-4.5-air:free,openai/gpt-oss-120b:free,nvidia/nemotron-3-nano-30b-a3b:free,minimax/minimax-m2.5:free,nvidia/nemotron-nano-9b-v2:free,nvidia/nemotron-nano-12b-v2-vl:free,google/gemma-4-31b-it:free
app.ai.DAILY_INSIGHT_MODEL=openai/gpt-oss-120b:free
app.ai.QUICK_ANALYSIS_MODEL=nvidia/nemotron-3-super-120b-a12b:free

# Google Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=8192

spring.ai.google.genai.embedding.enabled=false
spring.ai.google.genai.embedding.options.model=text-embedding-004

# OpenAI/OpenRouter embeddings
spring.ai.openai.embedding.options.model=nvidia/llama-nemotron-embed-vl-1b-v2:free

# Vector Store configuration
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.table-name=user_memory
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.dimension=2048
