# Active development profile
spring.profiles.active=dev

# Application
spring.application.name=FitnessApp

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.data.jdbc.repositories.enabled=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# N+1 issue optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# FatSecret API URLs (public endpoints, not secrets)
fatsecret.redirect-uri=http://localhost:8080/callback
fatsecret.auth-url=https://oauth.fatsecret.com/connect/authorize
fatsecret.token-url=https://oauth.fatsecret.com/connect/token
fatsecret.api-url=https://platform.fatsecret.com/rest/server.api
fatsecret.callback-url=http://localhost:8080/api/v1/nutrition/callback

# Cache
spring.cache.cache-names=StudentCache, CourseCache
spring.cache.caffeine.spec=initialCapacity=50,maximumSize=10,expireAfterAccess=300s

# Telegram Bot
telegram.bot.username=healthpaltest_bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
