# Application
spring.application.name=FitnessApp

# Required environment variables:
# - DB_URL
# - DB_USERNAME
# - DB_PASSWORD
# - TELEGRAM_BOT_TOKEN
# - FITNESS_APP_SECRET
# - FATSECRET_CLIENT_ID
# - FATSECRET_CLIENT_SECRET
# - FATSECRET_CONSUMER_KEY
# - FATSECRET_CONSUMER_SECRET
# - FATSECRET_REDIRECT_URI
# - FATSECRET_CALLBACK_URL
# - FATSECRET_TOKEN_ENCRYPTION_KEY
# - OPENROUTER_API_KEY
# - GEMINI_API_KEY
# Optional environment variables:
# - TELEGRAM_BOT_USERNAME

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.data.jdbc.repositories.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# N+1 issue optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# App Security
fitness.app.secret=${FITNESS_APP_SECRET}
fitness.app.jwt-expiration=${FITNESS_APP_JWT_EXPIRATION:PT24H}
fitness.app.cors.allowed-origins=${FITNESS_APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
fitness.app.auth-rate-limit.capacity=${FITNESS_APP_AUTH_RATE_LIMIT_CAPACITY:5}
fitness.app.auth-rate-limit.refill-period=${FITNESS_APP_AUTH_RATE_LIMIT_REFILL_PERIOD:PT1M}

# FatSecret
fatsecret.client-id=${FATSECRET_CLIENT_ID}
fatsecret.client-secret=${FATSECRET_CLIENT_SECRET}
fatsecret.consumer-key=${FATSECRET_CONSUMER_KEY}
fatsecret.consumer-secret=${FATSECRET_CONSUMER_SECRET}
fatsecret.redirect-uri=${FATSECRET_REDIRECT_URI}
fatsecret.auth-url=https://oauth.fatsecret.com/connect/authorize
fatsecret.token-url=https://oauth.fatsecret.com/connect/token
fatsecret.api-url=https://platform.fatsecret.com/rest/server.api
fatsecret.callback-url=${FATSECRET_CALLBACK_URL}
fatsecret.token-encryption.key=${FATSECRET_TOKEN_ENCRYPTION_KEY:}

# Cache
spring.cache.cache-names=StudentCache, CourseCache
spring.cache.caffeine.spec=initialCapacity=50,maximumSize=10,expireAfterAccess=300s

# Telegram Bot
telegram.bot.username=${TELEGRAM_BOT_USERNAME:healthpaltest_bot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

# OpenAI/OpenRouter
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=8192
app.ai.openrouter.fallback-models=inclusionai/ling-2.6-flash:free,z-ai/glm-4.5-air:free,openai/gpt-oss-120b:free,nvidia/nemotron-3-nano-30b-a3b:free,minimax/minimax-m2.5:free,nvidia/nemotron-nano-9b-v2:free,nvidia/nemotron-nano-12b-v2-vl:free,google/gemma-4-31b-it:free
app.ai.DAILY_INSIGHT_MODEL=openai/gpt-oss-120b:free
app.ai.QUICK_ANALYSIS_MODEL=nvidia/nemotron-3-super-120b-a12b:free

# Google Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=8192

spring.ai.google.genai.embedding.enabled=false
spring.ai.google.genai.embedding.options.model=text-embedding-004

# OpenAI/OpenRouter embeddings
spring.ai.openai.embedding.options.model=nvidia/llama-nemotron-embed-vl-1b-v2:free

# Vector Store configuration
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.table-name=user_memory
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.dimension=2048

# Memory cleanup
memory.cleanup.enabled=${MEMORY_CLEANUP_ENABLED:true}
memory.cleanup.cron=${MEMORY_CLEANUP_CRON:0 0 4 * * *}
