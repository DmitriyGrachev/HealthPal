spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.data.jdbc.repositories.enabled=false
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

fitness.app.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
fitness.app.jwt-expiration=PT1H
fitness.app.cors.allowed-origins=http://localhost:3000
fitness.app.auth-rate-limit.capacity=100
fitness.app.auth-rate-limit.refill-period=PT1M

fatsecret.consumer-key=test-consumer-key
fatsecret.consumer-secret=test-consumer-secret
fatsecret.client-id=test-client-id
fatsecret.client-secret=test-client-secret
fatsecret.redirect-uri=http://localhost/test/redirect
fatsecret.callback-url=http://localhost/test/callback
fatsecret.config-check.enabled=false
fatsecret.token-encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

telegram.bot.username=test_bot
telegram.bot.token=0000000000:test-token
telegram.bot.enabled=false

spring.ai.openai.api-key=test-openai-key
spring.ai.openai.base-url=http://localhost/openrouter
spring.ai.google.genai.api-key=test-gemini-key
spring.ai.google.genai.embedding.enabled=false
spring.ai.openai.embedding.options.model=test-embedding-model
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.table-name=user_memory
spring.ai.vectorstore.pgvector.dimension=2048
memory.cleanup.enabled=false

app.ai.openrouter.fallback-models=test-model-a,test-model-b
app.ai.DAILY_INSIGHT_MODEL=test-daily-model
app.ai.QUICK_ANALYSIS_MODEL=test-quick-model
