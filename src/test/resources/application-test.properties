fatsecret.callback-url=http://localhost/test/callback
fatsecret.config-check.enabled=false

telegram.bot.username=test_bot
telegram.bot.token=0000000000:test-token
telegram.bot.enabled=false

spring.ai.openai.api-key=test-openai-key
spring.ai.openai.base-url=http://localhost/openrouter
spring.ai.google.genai.api-key=test-gemini-key
spring.ai.google.genai.embedding.enabled=false
spring.ai.openai.embedding.options.model=test-embedding-model

app.ai.openrouter.fallback-models=test-model-a,test-model-b
app.ai.DAILY_INSIGHT_MODEL=test-daily-model
